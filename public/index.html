<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111"><link rel="manifest" href="/manifest.webmanifest"><title>BDK Delivery</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#171717;background:#f6f6f3;--red:#e31818;--yellow:#ffc400;--black:#111;--line:#ddd;--muted:#666}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f6f6f3}body{overflow-x:hidden}.top{position:sticky;top:0;z-index:20;background:var(--black);color:#fff;border-bottom:3px solid var(--red);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;display:flex;align-items:center;gap:8px}.brand:before{content:'BDK';background:var(--red);padding:4px 7px;border-radius:7px;font-size:12px}.nav{display:flex;gap:7px}.nav button{border:0;border-radius:10px;background:#292929;color:#fff;padding:9px 11px;font-weight:700}.wrap{max-width:1100px;margin:auto;padding:16px}.hero,.card,.panel{background:#fff;border-radius:18px;padding:18px;box-shadow:0 3px 16px #0000000b}.hero{margin-bottom:14px}.muted{color:var(--muted)}.cats{display:flex;gap:8px;overflow:auto;padding:4px 0 8px}.cats button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.price{font-weight:900;font-size:18px}.primary{border:0;background:var(--red);color:#fff;font-weight:900;border-radius:11px;padding:12px 15px}.secondary{border:1px solid var(--line);background:#fff;color:#171717;font-weight:800;border-radius:11px;padding:12px 15px}.cartbar{margin-top:18px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#111;color:#fff;border-radius:16px;padding:12px 14px;position:sticky;bottom:10px;z-index:10;box-shadow:0 8px 24px #0003}.cartbar button{background:var(--red);color:#fff;border:0;border-radius:10px;padding:10px 13px;font-weight:900}.help{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.help button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px}.admin{display:none}.owner .admin{display:block}.owner .client{display:none}.owner .nav-client{display:inline-flex}.client .nav-client{display:none}.client .nav-owner{display:none}.owner .nav-owner{display:inline-flex}.field{display:block;margin:10px 0}.field span{display:block;font-weight:800;margin-bottom:5px}.input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;background:#fff;font:inherit}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.status{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef7f0;font-weight:800;font-size:12px}.order{border-top:1px solid #eee;padding:12px 0}.order:first-child{border-top:0}.modal{position:fixed;inset:0;z-index:100;background:#0009;display:none;align-items:flex-end;justify-content:center;padding:0}.modal.open{display:flex}.sheet{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:20px}.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-20px;background:#fff;padding:0 0 10px;z-index:1}.close{border:1px solid var(--line);background:#fff;border-radius:9px;width:42px;height:42px;font-size:20px}.summary{background:#f7f7f5;border-radius:12px;padding:12px;margin:12px 0}.drink{border:2px solid var(--yellow);background:#fff9d9;border-radius:12px;padding:12px;margin:12px 0}.danger{color:#a00;font-weight:800}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}select{padding:8px;border:1px solid #ccc;border-radius:8px;background:#fff}.track{border:2px solid #ddd}.track h2{margin-top:0}.timeline{display:grid;gap:8px}.step{padding:9px 11px;border-radius:10px;background:#f3f3f1;font-weight:700}.step.done{background:#eaf6ed}.step.current{background:#fff5cf;border:1px solid #e5c54a}@media(min-width:800px){.modal{align-items:center;padding:18px}.sheet{border-radius:22px}}
</style></head>
<body>
<header class="top"><div class="brand">BDK Delivery</div><nav class="nav"><button class="nav-client" onclick="goClient()">Cardápio</button><button class="nav-owner" onclick="goOwner()">Gestão</button><button id="navCart" class="nav-client" onclick="openCart()">Carrinho</button><button onclick="openHelp()">Ajuda</button></nav></header>
<main class="wrap">
<section id="client" class="client">
 <div class="hero"><div class="row"><div><div class="muted">Cardápio online</div><h1 id="storeName">Carregando…</h1></div><strong id="storeStatus"></strong></div><p class="muted" id="storeInfo"></p><div class="help"><button onclick="openHelp()">Como fazer um pedido</button></div><div id="cats" class="cats"></div></div>
 <div id="activeOrder"></div>
 <div id="products" class="grid"></div>
 <div id="cartBar" class="cartbar" hidden><span>🛒 <b id="cartCount">0</b> itens · R$ <b id="cartTotal">0,00</b></span><button onclick="openCart()">Abrir carrinho</button></div>
</section>
<section id="admin" class="admin">
 <div class="hero"><div class="row"><div><div class="muted">Área do proprietário</div><h1>Gestão</h1></div><button class="secondary" onclick="goClient()">Ver cardápio</button></div><div id="metrics" class="grid"></div></div>
 <div class="panel"><h2>Pedidos</h2><div id="orders">Carregando…</div></div>
 <div class="panel" style="margin-top:14px"><h2>Configuração</h2><label class="field"><span>Nome da loja</span><input id="cfgName" class="input"></label><label class="field"><span>Taxa de entrega</span><input id="cfgFee" class="input" type="number" step="0.01"></label><label class="field"><span>Pedido mínimo</span><input id="cfgMin" class="input" type="number" step="0.01"></label><button class="primary" onclick="saveConfig()">Salvar</button></div>
</section></main>
<div id="modal" class="modal" aria-hidden="true"><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-head"><h2 id="modalTitle">BDK</h2><button class="close" onclick="closeModal()" aria-label="Fechar">×</button></div><div id="modalBody"></div></div></div>
<script>
'use strict';
const state={db:null,cart:[],category:null,owner:location.pathname==='/gestao',orderId:localStorage.getItem('bdk:lastOrderId')||null,trackTimer:null};
const $=id=>document.getElementById(id);const money=v=>Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
async function api(path,opts){const r=await fetch(path,opts);let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||'Erro na operação');return j}
function goClient(){location.href='/'}function goOwner(){location.href='/gestao'}function lockScroll(v){document.body.style.overflow=v?'hidden':''}
function openModal(title,body){closeModal();$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.add('open');$('modal').setAttribute('aria-hidden','false');lockScroll(true)}
function closeModal(){$('modal').classList.remove('open');$('modal').setAttribute('aria-hidden','true');$('modalBody').innerHTML='';lockScroll(false)}
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modal').classList.contains('open'))closeModal()});
function openHelp(){openModal(state.owner?'Ajuda da gestão':'Como fazer um pedido',state.owner?'<p>1. Acompanhe os pedidos.</p><p>2. Atualize o status conforme a operação avança.</p><p>3. Ajuste o cardápio/configuração quando necessário.</p>':'<p>1. Escolha os produtos.</p><p>2. Abra o carrinho.</p><p>3. Informe seus dados.</p><p>4. Confira e confirme.</p>')}
function renderClient(){const d=state.db;$('storeName').textContent=d.store.name;$('storeStatus').textContent=d.store.open?'ABERTO':'FECHADO';$('storeInfo').textContent=`Entrega R$ ${money(d.store.deliveryFee)} · pedido mínimo R$ ${money(d.store.minimumOrder)}`;$('cats').innerHTML='<button onclick="setCategory(null)">Todos</button>'+d.categories.filter(c=>c.active).map(c=>`<button onclick="setCategory('${c.id}')">${esc(c.name)}</button>`).join('');renderProducts();syncCart();renderActiveOrder()}
function setCategory(id){state.category=id;renderProducts()}
function renderProducts(){const d=state.db;const ps=d.products.filter(p=>p.active&&p.available!==false&&(!state.category||p.categoryId===state.category));$('products').innerHTML=ps.map(p=>`<article class="card"><h3>${esc(p.name)}</h3><p class="muted">${esc(p.description||'')}</p><div class="row"><span class="price">R$ ${money(p.price)}</span><button class="primary" onclick="add('${p.id}')">Adicionar</button></div></article>`).join('')||'<div class="hero">Nenhum produto disponível nesta categoria.</div>'}
function add(id){const p=state.db.products.find(x=>x.id===id);if(!p)return;const i=state.cart.find(x=>x.productId===id);if(i)i.qty++;else state.cart.push({productId:id,name:p.name,price:Number(p.price),qty:1});syncCart()}
function syncCart(){const n=state.cart.reduce((a,i)=>a+i.qty,0),t=state.cart.reduce((a,i)=>a+i.price*i.qty,0);$('cartCount').textContent=n;$('cartTotal').textContent=money(t);$('cartBar').hidden=!n}
function openCart(){if(!state.cart.length){openModal('Seu pedido','<p>Seu carrinho está vazio.</p>');return}const subtotal=state.cart.reduce((a,i)=>a+i.price*i.qty,0);const total=subtotal+Number(state.db.store.deliveryFee);openModal('Seu pedido',`<div>${state.cart.map(i=>`<div class="row" style="padding:9px 0;border-bottom:1px solid #eee"><span>${i.qty}× ${esc(i.name)}</span><b>R$ ${money(i.price*i.qty)}</b></div>`).join('')}</div><div class="summary"><b>Subtotal:</b> R$ ${money(subtotal)}<br><b>Entrega:</b> R$ ${money(state.db.store.deliveryFee)}<br><b>Total:</b> R$ ${money(total)}</div><div class="actions"><button class="primary" onclick="checkout()">Continuar</button><button class="secondary" onclick="closeModal()">Continuar comprando</button></div>`)}
function checkout(){const subtotal=state.cart.reduce((a,i)=>a+i.price*i.qty,0);if(subtotal<Number(state.db.store.minimumOrder)){openModal('Pedido mínimo',`<p>O pedido mínimo é <b>R$ ${money(state.db.store.minimumOrder)}</b>.</p>`);return}const drinks=state.cart.filter(i=>/bebida|refrigerante|suco|água|agua/i.test(i.name));const total=subtotal+Number(state.db.store.deliveryFee);openModal('Dados para entrega',`<form id="checkoutForm"><label class="field"><span>Nome</span><input class="input" name="name" required></label><label class="field"><span>WhatsApp</span><input class="input" name="phone" inputmode="tel" required></label><label class="field"><span>Endereço</span><textarea class="input" name="address" required></textarea></label><label class="field"><span>Referência</span><input class="input" name="reference"></label><label class="field"><span>Pagamento</span><select class="input" name="payment" onchange="toggleCash(this.value)"><option value="Pix">Pix</option><option value="Dinheiro">Dinheiro</option></select></label><label id="cashField" class="field" style="display:none"><span>Valor entregue</span><input class="input" name="cash" type="number" step="0.01"></label><label class="field"><span>Observações</span><textarea class="input" name="notes"></textarea></label>${drinks.length?`<div class="drink"><b>🥤 Confira as bebidas</b><p>${drinks.map(i=>i.qty+'× '+esc(i.name)).join(', ')}</p><label><input type="checkbox" name="beverage" required> Confirmo as bebidas.</label></div>`:`<div class="drink"><b>🥤 Sem bebida</b><label><input type="checkbox" name="beverage" required> Confirmo que não quero bebida.</label></div>`}<div class="summary"><b>Total: R$ ${money(total)}</b></div><div class="actions"><button class="primary" type="submit">Revisar pedido</button><button class="secondary" type="button" onclick="openCart()">Voltar</button></div></form>`);$('checkoutForm').addEventListener('submit',e=>{e.preventDefault();review(new FormData(e.target),total)})}
function toggleCash(v){$('cashField').style.display=v==='Dinheiro'?'block':'none'}
function review(fd,total){const payment=fd.get('payment'),cash=Number(fd.get('cash')||0);if(payment==='Dinheiro'&&cash<=total){openModal('Valor inválido',`<p>Informe um valor maior que <b>R$ ${money(total)}</b>.</p>`);return}const customer={name:String(fd.get('name')).trim(),phone:String(fd.get('phone')).trim(),address:String(fd.get('address')).trim(),reference:String(fd.get('reference')||'').trim()};const payload={customer,payment,cash,notes:String(fd.get('notes')||'').trim(),beverage:Boolean(fd.get('beverage'))};openModal('Confirme seu pedido',`<div class="summary"><b>Itens</b>${state.cart.map(i=>`<div class="row"><span>${i.qty}× ${esc(i.name)}</span><span>R$ ${money(i.price*i.qty)}</span></div>`).join('')}<hr><p><b>Total:</b> R$ ${money(total)}</p><p><b>Entrega:</b> ${esc(customer.address)}</p><p><b>Pagamento:</b> ${esc(payment)}${payment==='Dinheiro'?` · troco R$ ${money(cash-total)}`:''}</p></div><div class="actions"><button class="primary" onclick='submitOrder(${JSON.stringify(payload).replace(/'/g,"&#39;")})'>Confirmar pedido</button><button class="secondary" onclick="checkout()">Voltar e corrigir</button></div>`)}
async function submitOrder(payload){try{const id=crypto.randomUUID();const o=await api('/api/orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({customer:payload.customer,items:state.cart,payment:payload.payment,cashReceived:payload.cash,notes:payload.notes,beverageConfirmation:payload.beverage,clientRequestId:id})});state.cart=[];state.orderId=o.id;localStorage.setItem('bdk:lastOrderId',o.id);syncCart();showOrderSuccess(o)}catch(e){openModal('Não foi possível enviar',`<p class="danger">${esc(e.message)}</p>`)}}
function showOrderSuccess(o){openModal('Pedido recebido',`<p>Pedido <b>#${esc(o.number)}</b> recebido.</p><p>Status: <b>${esc(o.status)}</b>.</p><div class="actions"><button class="primary" onclick="closeModal();renderActiveOrder()">Acompanhar pedido</button></div>`);renderActiveOrder()}
const stages=['NEW','ACCEPTED','PREPARING','READY','OUT_FOR_DELIVERY','DELIVERED'];
const labels={NEW:'Recebido',ACCEPTED:'Aceito pela loja',PREPARING:'Em preparação',READY:'Pronto',OUT_FOR_DELIVERY:'Saiu para entrega',DELIVERED:'Entregue',CANCELLED:'Cancelado'};
function renderActiveOrder(){if(state.owner||!state.orderId){$('activeOrder').innerHTML='';return}$('activeOrder').innerHTML=`<section class="hero track"><div class="row"><div><div class="muted">Meu pedido</div><h2 id="trackTitle">Consultando…</h2></div><span id="trackStatus" class="status">ATUALIZANDO</span></div><div id="timeline" class="timeline"></div><div class="actions"><button class="secondary" onclick="refreshOrder()">Atualizar status</button><button class="secondary" onclick="forgetOrder()">Ocultar acompanhamento</button></div></section>`;refreshOrder();clearInterval(state.trackTimer);state.trackTimer=setInterval(refreshOrder,15000)}
async function refreshOrder(){if(!state.orderId)return;try{const t=await api('/api/orders/'+encodeURIComponent(state.orderId)+'/ticket');$('trackTitle').textContent='Pedido #'+t.number;const status=(t.lines&&t.lines[2]||'').replace('STATUS: ','').trim();$('trackStatus').textContent=labels[status]||status;$('timeline').innerHTML=stages.map(s=>{const idx=stages.indexOf(s),cur=stages.indexOf(status);return `<div class="step ${idx<cur?'done ':''}${s===status?'current':''}">${idx<cur?'✓ ':''}${labels[s]}</div>`}).join('')+(status==='CANCELLED'?'<div class="step current">Pedido cancelado</div>':'');if(status==='DELIVERED'||status==='CANCELLED')clearInterval(state.trackTimer)}catch(e){if($('trackStatus'))$('trackStatus').textContent='INDISPONÍVEL'}}
function forgetOrder(){localStorage.removeItem('bdk:lastOrderId');state.orderId=null;clearInterval(state.trackTimer);renderActiveOrder()}
async function renderOwner(){const [store,orders,metrics]=await Promise.all([api('/api/store'),api('/api/orders'),api('/api/metrics')]);state.db=store;$('cfgName').value=store.store.name;$('cfgFee').value=store.store.deliveryFee;$('cfgMin').value=store.store.minimumOrder;$('metrics').innerHTML=`<div class="card"><div class="muted">Pedidos</div><h2>${metrics.orders}</h2></div><div class="card"><div class="muted">Entregues</div><h2>${metrics.delivered}</h2></div><div class="card"><div class="muted">Faturamento entregue</div><h2>R$ ${money(metrics.revenue)}</h2></div>`;$('orders').innerHTML=orders.length?'<div class="table-wrap"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Total</th><th>Status</th></tr></thead><tbody>'+orders.map(o=>`<tr><td>#${esc(o.number)}</td><td>${esc(o.customer?.name||'')}</td><td>R$ ${money(o.total)}</td><td><select onchange="changeStatus('${o.id}',this.value)">${['NEW','ACCEPTED','PREPARING','READY','OUT_FOR_DELIVERY','DELIVERED','CANCELLED'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')+'</tbody></table></div>':'<p>Nenhum pedido.</p>'}
async function changeStatus(id,status){await api('/api/orders/'+id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({status})});await renderOwner()}
async function saveConfig(){try{await api('/api/store',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({name:$('cfgName').value,deliveryFee:Number($('cfgFee').value),minimumOrder:Number($('cfgMin').value)})});openModal('Configuração salva','<p>Alterações salvas.</p><div class="actions"><button class="primary" onclick="closeModal()">OK</button></div>')}catch(e){openModal('Erro',`<p class="danger">${esc(e.message)}</p>`)}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function boot(){document.body.classList.add(state.owner?'owner':'client');if(state.owner)await renderOwner();else{state.db=await api('/api/store');renderClient()}}
boot().catch(e=>openModal('Erro ao carregar',`<p class="danger">${esc(e.message)}</p>`));
</script></body></html>
